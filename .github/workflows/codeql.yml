name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"
  schedule:
    # Weekly, so new queries are applied to unchanged code too.
    - cron: "27 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20

    permissions:
      # Required to upload results to the Security tab.
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
            runs-on: ubuntu-latest
          # watchdog_fsevents.c links CoreFoundation/CoreServices, so it only
          # compiles on macOS. CodeQL needs a real build to analyse C.
          - language: c-cpp
            build-mode: manual
            runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build extension module
        if: matrix.build-mode == 'manual'
        run: |
          python -m pip install -U setuptools
          python setup.py build_ext --inplace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: "/language:${{ matrix.language }}"
